<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정부지원사업 공고 매칭·신청서 초안 서비스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>정부지원사업 공고 매칭·신청서 초안 서비스</h1>
<p class="warnbox">화면의 공고는 모두 직접 만든 가상 예시이며 실제 공고가 아닙니다. 실제 신청은 공고 원문을 확인하세요.</p>

<section class="card">
<h2>1. 내 사업자 조건</h2>
<div class="row">
<div><label for="industry">업종</label><select id="industry"></select></div>
<div><label for="region">지역</label><select id="region"></select></div>
</div>
<div class="row">
<div><label for="bizYears">업력(년, 예비는 0)</label><input id="bizYears" type="number" step="0.5" min="0" inputmode="decimal"></div>
<div><label for="employees">직원 수(명)</label><input id="employees" type="number" min="0" inputmode="numeric"></div>
</div>
<div class="row">
<div><label for="repAge">대표 나이(세)</label><input id="repAge" type="number" min="15" inputmode="numeric"></div>
<div><label for="today">오늘 날짜</label><input id="today" type="text" inputmode="numeric" placeholder="2026-11-17"></div>
</div>
<button id="run">공고 찾기</button>
<button id="reset" class="sub">샘플로 되돌리기</button>
<div id="out" aria-live="polite"></div>
</section>

<section class="card">
<h2>2. 신청서 초안</h2>
<label for="pick">공고 고르기</label>
<select id="pick"></select>
<button id="mkDraft">초안 만들기</button>
<div id="draftOut" aria-live="polite"></div>
</section>
<p class="note">입력값은 이 휴대폰 안에만 저장됩니다. 결제·전송 기능은 없습니다. 초안은 문단 틀이며 [ ] 칸은 직접 채웁니다.</p>
</main>
<script src="core.js"></script>
<script>
(function () {
  var C = window.Core, $ = function (id) { return document.getElementById(id); };
  var KEY = 'prj0092-v1';
  var ids = ['industry', 'region', 'bizYears', 'employees', 'repAge', 'today', 'pick'];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function opts(el, arr) { el.innerHTML = arr.map(function (a) { return '<option>' + esc(a) + '</option>'; }).join(''); }
  opts($('industry'), C.INDUSTRIES); opts($('region'), C.REGIONS);
  $('pick').innerHTML = C.SAMPLE_GRANTS.map(function (g) { return '<option value="' + g.id + '">' + esc(g.name) + '</option>'; }).join('');
  function setDefaults() {
    var d = C.SAMPLE_PROFILE;
    $('industry').value = d.industry; $('region').value = d.region; $('bizYears').value = d.bizYears;
    $('employees').value = d.employees; $('repAge').value = d.repAge; $('today').value = d.today;
  }
  function load() {
    setDefaults();
    var s = {};
    try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { s = {}; }
    ids.forEach(function (id) { if (s[id] !== undefined && s[id] !== null) $(id).value = s[id]; });
  }
  function save() {
    try { var o = {}; ids.forEach(function (id) { o[id] = $(id).value; }); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  function profile() {
    return { industry: $('industry').value, region: $('region').value, bizYears: $('bizYears').value,
      employees: $('employees').value, repAge: $('repAge').value, today: $('today').value };
  }
  function run() {
    save();
    var r = C.rank(profile(), C.SAMPLE_GRANTS), h = '';
    if (r.errors.length) { $('out').innerHTML = '<p class="bad">' + r.errors.map(esc).join('<br>') + '</p>'; return; }
    var s = C.summarize(r.results);
    h += '<p>자격 일치 <span class="ok">' + s.eligible + '건</span> (7일 이내 마감 ' + s.urgent + '건), 불일치 ' + s.ineligible + '건, 마감 ' + s.closed + '건</p>';
    r.results.forEach(function (x) {
      var g = x.grant, label = x.status === 'eligible' ? '자격 일치' : x.status === 'closed' ? '마감' : '자격 불일치';
      h += '<div class="g ' + x.status + '"><h3>' + esc(g.name) + '</h3>' +
        '<span class="tag ' + x.status + '">' + label + '</span> <span class="tag' + (x.urgent ? ' urgent' : '') + '">' + esc(x.dLabel) + '</span> ' +
        '<span class="gray">' + esc(g.deadline) + ' · 최대 ' + C.won(g.amount) + '</span><ul>';
      x.reasons.forEach(function (m) { h += '<li class="bad">' + esc(m) + '</li>'; });
      x.matched.forEach(function (m) { h += '<li class="ok">' + esc(m) + '</li>'; });
      h += '</ul></div>';
    });
    $('out').innerHTML = h;
  }
  function mk() {
    save();
    var g = C.SAMPLE_GRANTS.filter(function (x) { return x.id === $('pick').value; })[0];
    var d = C.draftApplication(profile(), g);
    if (d.errors.length) { $('draftOut').innerHTML = '<p class="bad">' + d.errors.map(esc).join('<br>') + '</p>'; return; }
    $('draftOut').innerHTML = (d.warning ? '<p class="bad">' + esc(d.warning) + '</p>' : '') +
      '<p class="note">가상 예시 공고 기준 초안입니다.</p><textarea readonly>' + esc(d.text) + '</textarea>';
  }
  $('run').onclick = run; $('mkDraft').onclick = mk;
  $('reset').onclick = function () { setDefaults(); run(); mk(); };
  load(); run(); mk();
})();
</script>
</body>
</html>
