<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f9"><title>Projectfolio · PRJ-0100</title>
<style>
:root{--navy:#1f3864;--sage:#5b7f6a;--ink:#172235;--muted:#68758a;--bg:#f4f6f9;--line:#e5eaf0;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{max-width:1080px;margin:auto;min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:24px 15px}.brand{font-weight:800;font-size:17px;padding:8px 10px 25px;color:var(--navy)}nav{display:grid;gap:5px}nav button{border:0;background:transparent;text-align:left;padding:13px;border-radius:11px;color:var(--muted)}nav button.active{background:#edf2f8;color:var(--navy);font-weight:800}main{padding:28px 30px 100px}.view{display:none}.view.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:27px;margin:0 0 7px;letter-spacing:-1px}h2{font-size:16px;margin:0 0 14px}.sub{color:var(--muted);font-size:12px}.btn{border:0;background:var(--navy);color:white;border-radius:10px;padding:11px 14px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:13px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;grid-column:span 4;min-width:0}.wide{grid-column:span 8}.full{grid-column:span 12}.metric{font-size:28px;font-weight:800;margin:8px 0}.muted{color:var(--muted);font-size:11px}.item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.item:last-child{border:0}.tag{background:#e8f2ec;color:#426c53;border-radius:20px;padding:5px 8px;font-size:10px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white}.field textarea{min-height:75px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.bottom{display:none}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#172235;color:white;border-radius:10px;padding:11px 15px;opacity:0;transition:.2s}.toast.show{opacity:1}
@media(max-width:700px){.app{display:block}.side{display:none}main{padding:20px 14px 100px}.card,.wide{grid-column:span 12}.formgrid{grid-template-columns:1fr}.bottom{display:grid;position:fixed;bottom:0;left:0;right:0;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:none;color:var(--muted);font-size:10px;padding:5px}.bottom button.active{color:var(--navy);font-weight:800}.bottom b{display:block;font-size:17px;margin-bottom:3px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">P / Projectfolio</div><nav id="side"></nav></aside><main>
<section class="view active" id="home"><div class="head"><div><h1>프로젝트 현황</h1><div class="sub">개인 프로젝트 작업공간</div></div><button class="btn" onclick="formOpen()">＋ 새 프로젝트</button></div><div class="grid"><div class="card"><div class="muted">전체 프로젝트</div><div class="metric" id="total">0</div></div><div class="card"><div class="muted">진행 중</div><div class="metric" id="active">0</div></div><div class="card"><div class="muted">완료</div><div class="metric" id="done">0</div></div><div class="card wide"><h2>최근 프로젝트</h2><div id="recent"></div></div><div class="card"><h2>빠른 시작</h2><div class="item"><span>프로젝트 등록</span><button class="btn" onclick="formOpen()">열기</button></div><div class="item"><span>전체 프로젝트</span><button class="btn" onclick="go('projects')">열기</button></div></div></div></section>
<section class="view" id="projects"><div class="head"><div><h1>프로젝트</h1><div class="sub">프로젝트 등록, 검색, 상태 관리</div></div><button class="btn" onclick="formOpen()">＋ 등록</button></div><div class="field"><input id="q" placeholder="프로젝트명 검색" oninput="render()"></div><div class="grid" id="list"></div></section>
<section class="view" id="calendar"><div class="head"><div><h1>일정</h1><div class="sub">프로젝트 목표일 및 마일스톤</div></div></div><div class="card full" id="events"></div></section>
<section class="view" id="portfolio"><div class="head"><div><h1>포트폴리오</h1><div class="sub">외부 소개 후보 프로젝트</div></div></div><div class="grid" id="public"></div></section>
<section class="view" id="more"><div class="head"><div><h1>리포트 및 설정</h1><div class="sub">데이터 백업과 진행 현황</div></div></div><div class="card full"><h2>데이터 관리</h2><button class="btn" onclick="backup()">JSON 백업</button><div class="field"><label>백업 복원</label><input type="file" accept="application/json" onchange="restore(event)"></div><button class="btn" onclick="reset()">샘플 데이터 초기화</button><p class="muted">브라우저 localStorage 기반 데모입니다. 서버 동기화 및 계정 인증은 미연결입니다.</p></div></section>
</main></div><nav class="bottom" id="bottom"></nav><div id="toast" class="toast"></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:#14203366;align-items:end;justify-content:center;padding:12px"><div style="background:white;border-radius:20px;padding:20px;width:min(600px,100%);max-height:90vh;overflow:auto"><div class="head"><h2>프로젝트 등록</h2><button class="btn" onclick="closeForm()">닫기</button></div><form id="f" onsubmit="save(event)"><div class="field"><label>프로젝트명 *</label><input name="name" required></div><div class="field"><label>설명</label><textarea name="description"></textarea></div><div class="formgrid"><div class="field"><label>카테고리</label><select name="category"><option>생산성</option><option>AI 자동화</option><option>콘텐츠</option><option>업무 도구</option><option>기타</option></select></div><div class="field"><label>상태</label><select name="status"><option value="idea">아이디어</option><option value="planned">계획</option><option value="in_progress">진행 중</option><option value="on_hold">보류</option><option value="launched">출시</option><option value="archived">종료</option></select></div><div class="field"><label>우선순위</label><select name="priority"><option>보통</option><option>높음</option><option>낮음</option></select></div><div class="field"><label>목표일</label><input name="dueDate" type="date"></div></div><div class="field"><label>태그</label><input name="tags" placeholder="쉼표로 구분"></div><button class="btn" type="submit">저장</button></form></div></div>
<script>
const menus=[['home','홈','⌂'],['projects','프로젝트','▦'],['calendar','일정','▣'],['portfolio','포트폴리오','◇'],['more','더보기','•••']];let data=JSON.parse(localStorage.getItem('pf-projects')||'null')||[{id:'sample-1',name:'개인 프로젝트 포트폴리오 관리 앱',description:'개인 프로젝트 기획부터 운영까지 통합 관리',category:'생산성',status:'in_progress',priority:'높음',dueDate:'2027-01-31',tags:['mobile','portfolio'],isPublic:true},{id:'sample-2',name:'AI 업무 자동화 워크플로',description:'반복 업무 자동화 실험',category:'AI 자동화',status:'planned',priority:'보통',dueDate:'2027-02-15',tags:['AI','workflow'],isPublic:false}];
function persist(){localStorage.setItem('pf-projects',JSON.stringify(data));render()}
function go(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));render();scrollTo(0,0)}
function build(){menus.forEach(([id,label,icon])=>{document.getElementById('side').innerHTML+=`<button data-id="${id}" onclick="go('${id}')">${icon}　${label}</button>`;document.getElementById('bottom').innerHTML+=`<button data-id="${id}" onclick="go('${id}')"><b>${icon}</b>${label}</button>`})}
function formOpen(){document.getElementById('modal').style.display='flex'}function closeForm(){document.getElementById('modal').style.display='none';document.getElementById('f').reset()}
function save(e){e.preventDefault();let f=new FormData(e.target);data.unshift({id:'p-'+Date.now(),name:f.get('name').trim(),description:f.get('description'),category:f.get('category'),status:f.get('status'),priority:f.get('priority'),dueDate:f.get('dueDate'),tags:f.get('tags').split(',').map(x=>x.trim()).filter(Boolean),isPublic:false});closeForm();persist();go('projects');toast('프로젝트를 저장했습니다.')}
function render(){let active=data.filter(p=>['planned','in_progress'].includes(p.status));document.getElementById('total').textContent=data.length;document.getElementById('active').textContent=active.length;document.getElementById('done').textContent=data.filter(p=>['launched','archived'].includes(p.status)).length;let card=p=>`<div class="card"><span class="tag">${p.status}</span><h2 style="margin-top:13px">${esc(p.name)}</h2><p class="sub">${esc(p.description||'')}</p><div class="muted" style="margin-top:12px">${esc(p.category)} · 목표일 ${esc(p.dueDate||'미정')}</div></div>`;document.getElementById('recent').innerHTML=data.slice(0,4).map(p=>`<div class="item"><b>${esc(p.name)}</b><span class="tag">${p.status}</span></div>`).join('');let q=(document.getElementById('q')?.value||'').toLowerCase();document.getElementById('list').innerHTML=data.filter(p=>p.name.toLowerCase().includes(q)).map(p=>card(p)+`<div class="card"><h2>관리</h2><button class="btn" onclick="remove('${p.id}')">삭제</button><button class="btn" style="margin-left:6px" onclick="togglePublic('${p.id}')">${p.isPublic?'공개 해제':'공개 후보'}</button></div>`).join('')||'<div class="card full">검색 결과가 없습니다.</div>';document.getElementById('events').innerHTML=data.filter(p=>p.dueDate).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).map(p=>`<div class="item"><span>${esc(p.dueDate)}　<b>${esc(p.name)}</b></span><span class="tag">목표일</span></div>`).join('')||'예정 일정이 없습니다.';document.getElementById('public').innerHTML=data.filter(p=>p.isPublic).map(card).join('')||'<div class="card full">공개 후보 프로젝트가 없습니다.</div>'}
function remove(id){if(confirm('프로젝트를 삭제할까요?')){data=data.filter(p=>p.id!==id);persist()}}function togglePublic(id){let p=data.find(x=>x.id===id);p.isPublic=!p.isPublic;persist();toast('포트폴리오 공개 후보를 변경했습니다.')}
function backup(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='projectfolio-backup.json';a.click();URL.revokeObjectURL(u)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x)||x.some(p=>!p.id||!p.name))throw 0;if(confirm('현재 데이터를 교체할까요?')){data=x;persist();toast('백업을 복원했습니다.')}}catch(_){toast('올바른 JSON 파일이 아닙니다.')}};r.readAsText(f)}
function reset(){if(confirm('샘플 데이터로 초기화할까요?')){localStorage.removeItem('pf-projects');location.reload()}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
build();go('home');
</script></body></html>
