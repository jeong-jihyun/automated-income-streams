<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SoundShelf · BGM Library</title>
<style>
:root{--pine:#173b36;--mint:#b8e4d5;--bg:#f5f7f4;--ink:#17211f;--muted:#687571;--line:#e3e9e5;--white:#fff;--warn:#9a681b;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:#e9eeea;color:var(--ink);font-family:system-ui,-apple-system,"Pretendard","Malgun Gothic",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.phone{max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);position:relative;padding-bottom:92px;box-shadow:0 0 40px #183b3618}
header{padding:22px 20px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:-.5px;font-size:20px}.brand span{color:#438b78}.avatar{width:38px;height:38px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:800;color:var(--pine)}
main{padding:8px 20px 28px}.eyebrow{font-size:11px;letter-spacing:1.3px;color:#548075;font-weight:800;text-transform:uppercase}.h1{font-size:27px;line-height:1.2;letter-spacing:-1px;margin:8px 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.search{display:flex;gap:8px;margin:20px 0}.search input,.field input,.field select{width:100%;border:1px solid var(--line);background:white;border-radius:14px;padding:14px;outline:none}.search input:focus,.field input:focus{border-color:#438b78;box-shadow:0 0 0 3px #b8e4d566}.btn{border:0;border-radius:14px;background:var(--pine);color:white;padding:13px 16px;font-weight:700}.btn.light{background:#e8f1ed;color:var(--pine)}.btn.ghost{background:white;color:var(--pine);border:1px solid var(--line)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-head h2{font-size:17px;margin:0}.link{color:#438b78;font-size:12px;font-weight:750;border:0;background:none}
.hero{background:linear-gradient(135deg,#173b36,#2c6558);color:white;border-radius:24px;padding:22px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff25;border-radius:50%;right:-40px;top:-40px;box-shadow:0 0 0 22px #ffffff0a,0 0 0 44px #ffffff08}.hero h2{font-size:22px;line-height:1.25;max-width:240px;margin:8px 0}.hero p{color:#d3e7df;font-size:12px;max-width:230px}.hero .btn{background:var(--mint);color:var(--pine);margin-top:8px}
.pills{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.pill{white-space:nowrap;border:1px solid var(--line);border-radius:30px;background:white;padding:9px 13px;font-size:12px;color:var(--muted)}.pill.active{background:var(--pine);color:white;border-color:var(--pine)}
.track{display:flex;align-items:center;gap:12px;background:white;border:1px solid var(--line);padding:12px;border-radius:17px;margin:9px 0}.art{width:54px;height:54px;border-radius:13px;flex:none;display:grid;place-items:center;color:#244c43;font-size:22px;background:linear-gradient(145deg,#d6e9df,#9fc9b9)}.track:nth-child(2n) .art{background:linear-gradient(145deg,#e8d9c8,#c7a98a)}.track:nth-child(3n) .art{background:linear-gradient(145deg,#d9d8ef,#a8a6d1)}.track-info{min-width:0;flex:1}.track-info strong{display:block;font-size:13px}.track-info small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.play,.heart{border:0;background:#edf4f0;color:var(--pine);border-radius:50%;width:38px;height:38px;font-size:15px}.heart{background:transparent;font-size:19px;width:32px}.heart.on{color:#c65c63}.tag{display:inline-block;border-radius:7px;background:#e8f3ed;color:#34715e;font-size:10px;padding:4px 7px;margin-top:6px}.tag.warn{background:#fff1d9;color:var(--warn)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#ffffffed;backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:5}.tab{border:0;background:none;color:#89938f;font-size:10px;display:grid;gap:4px;justify-items:center;padding:5px}.tab b{font-size:19px;font-weight:500}.tab.active{color:var(--pine);font-weight:800}.tab.active b{background:#e6f1ec;border-radius:12px;padding:3px 12px}
.detail-art{height:190px;border-radius:24px;background:linear-gradient(145deg,#d7e9df,#8eb9a7);display:grid;place-items:center;font-size:64px;margin:10px 0 18px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.meta div{background:white;border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center}.meta strong{display:block;font-size:15px}.meta small{color:var(--muted);font-size:10px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.panel h3{margin:0 0 9px;font-size:14px}.panel p,.panel li{font-size:12px;color:var(--muted);line-height:1.65}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.field small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.field input[type=file]{padding:10px}.notice{background:#fff6e7;border-radius:13px;padding:12px;color:#78561c;font-size:11px;line-height:1.5}.empty{text-align:center;padding:38px 15px;color:var(--muted)}.empty b{font-size:36px;display:block;margin-bottom:10px}
.range{display:flex;gap:8px}.range input{min-width:0}.hidden{display:none!important}.back{border:0;background:none;color:var(--pine);padding:8px 0;font-weight:700}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
@media(min-width:700px){body{padding:20px 0}.phone{border-radius:28px;overflow:hidden;min-height:calc(100dvh - 40px)}.tabbar{bottom:20px;border-radius:0 0 28px 28px}}
</style></head><body><div class="phone">
<header><div class="brand">sound<span>shelf</span> ♪</div><div class="avatar">J</div></header>
<main id="app"></main>
<nav class="tabbar">
<button class="tab active" data-tab="home"><b>⌂</b>홈</button><button class="tab" data-tab="explore"><b>⌕</b>탐색</button><button class="tab" data-tab="library"><b>♡</b>보관함</button><button class="tab" data-tab="plans"><b>◇</b>구독</button><button class="tab" data-tab="profile"><b>☻</b>내 정보</button>
</nav></div>
<script>
const tracks=[
{id:'BGM-001',title:'Morning in the Garden',genre:'Acoustic',mood:'따뜻한',bpm:92,duration:'2:34',rights:'확인 필요',icon:'☀',desc:'부드러운 기타와 피아노가 어우러진 아침 분위기의 어쿠스틱 트랙.'},
{id:'BGM-002',title:'Quiet City Lights',genre:'Lo-fi',mood:'차분한',bpm:78,duration:'3:12',rights:'확인됨',icon:'☾',desc:'도시의 밤을 닮은 따뜻한 로파이 비트.'},
{id:'BGM-003',title:'Beyond the Horizon',genre:'Cinematic',mood:'웅장한',bpm:118,duration:'2:58',rights:'확인됨',icon:'✧',desc:'영상의 전환과 클라이맥스를 위한 시네마틱 사운드.'},
{id:'BGM-004',title:'Little Happy Steps',genre:'Pop',mood:'밝은',bpm:124,duration:'2:06',rights:'검토 필요',icon:'♫',desc:'경쾌한 리듬의 밝은 팝 배경음악.'},
{id:'BGM-005',title:'Deep Focus',genre:'Ambient',mood:'차분한',bpm:65,duration:'4:10',rights:'확인됨',icon:'◌',desc:'집중과 명상을 돕는 미니멀 앰비언트.'}
];
function readFavorites(){try{const raw=localStorage.getItem('ss-favs');const value=raw?JSON.parse(raw):[];return Array.isArray(value)?value.filter(x=>typeof x==='string'):[]}catch(e){return []}}
function writeFavorites(){try{localStorage.setItem('ss-favs',JSON.stringify([...favorites]))}catch(e){/* 저장소가 차단되어도 화면 기능은 계속 동작 */}}
let favorites=new Set(readFavorites()), current='BGM-001', playing=null, tab='home', query='', mood='전체', detailFrom='explore';
const app=document.getElementById('app');
function trackCard(t){return `<div class="track"><div class="art">${t.icon}</div><div class="track-info" onclick="openTrack('${t.id}')"><strong>${t.title}</strong><small>${t.genre} · ${t.mood} · ${t.bpm} BPM</small><span class="tag ${t.rights==='확인됨'?'':'warn'}">${t.rights}</span></div><button class="play" onclick="togglePlay('${t.id}')">${playing===t.id?'Ⅱ':'▶'}</button><button class="heart ${favorites.has(t.id)?'on':''}" onclick="toggleFav('${t.id}')">${favorites.has(t.id)?'♥':'♡'}</button></div>`}
function sectionHeading(k,title,sub=''){return `<div class="eyebrow">${k}</div><h1 class="h1">${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}`}
function home(){return `${sectionHeading('YOUR DAILY SOUND','오늘의 장면에<br>어울리는 음악','영상과 콘텐츠를 위한 배경음악을 발견해 보세요.')}<div class="search"><input placeholder="곡 제목, 장르, 분위기 검색" oninput="query=this.value"><button class="btn" onclick="go('explore')">검색</button></div><div class="hero"><div class="eyebrow" style="color:#b8e4d5">CURATED PLAYLIST</div><h2>마음이 편안해지는<br>작은 순간들</h2><p>차분한 영상과 일상 브이로그에 어울리는 사운드</p><button class="btn" onclick="go('explore');mood='차분한';render()">컬렉션 듣기 →</button></div><div class="section-head"><h2>지금 많이 찾는 곡</h2><button class="link" onclick="go('explore')">전체 보기</button></div>${tracks.slice(0,3).map(trackCard).join('')}<div class="section-head"><h2>최근 추가된 사운드</h2></div>${trackCard(tracks[3])}`}
function explore(){let list=tracks.filter(t=>(!query||(`${t.title} ${t.genre} ${t.mood}`).toLowerCase().includes(query.toLowerCase()))&&(mood==='전체'||t.mood===mood));return `${sectionHeading('DISCOVER','탐색하기','원하는 분위기와 장르를 선택해 보세요.')}<div class="search"><input value="${query}" placeholder="어떤 음악을 찾으세요?" oninput="query=this.value;render()"><button class="btn light" onclick="document.getElementById('filters').classList.toggle('hidden')">필터</button></div><div id="filters" class="panel"><h3>분위기</h3><div class="pills">${['전체','차분한','따뜻한','밝은','웅장한'].map(x=>`<button class="pill ${mood===x?'active':''}" onclick="mood='${x}';render()">${x}</button>`).join('')}</div><div class="field"><label>장르</label><select id="genre"><option>전체</option>${['Acoustic','Lo-fi','Cinematic','Pop','Ambient'].map(x=>`<option>${x}</option>`).join('')}</select></div><button class="btn" onclick="let g=document.getElementById('genre').value;query=g==='전체'?query:g;render()">조건 적용</button></div><div class="section-head"><h2>추천 트랙 <small style="color:var(--muted)">(${list.length})</small></h2></div>${list.length?list.map(trackCard).join(''):'<div class="empty">검색 결과가 없습니다.</div>'}`}
function openTrack(id){current=id;detailFrom=tab;tab='detail';render()}
function detail(){let t=tracks.find(x=>x.id===current);return `<button class="back" onclick="go('${detailFrom}')">← 돌아가기</button><div class="detail-art">${t.icon}</div><div class="eyebrow">${t.genre} · ${t.id}</div><h1 class="h1">${t.title}</h1><p class="sub">${t.desc}</p><div class="meta"><div><strong>${t.bpm}</strong><small>BPM</small></div><div><strong>${t.duration}</strong><small>길이</small></div><div><strong>${t.mood}</strong><small>분위기</small></div></div><div class="panel"><div class="row"><button class="btn" onclick="togglePlay('${t.id}')">${playing===t.id?'Ⅱ 일시정지':'▶ 30초 미리듣기'}</button><button class="btn light" onclick="toggleFav('${t.id}')">${favorites.has(t.id)?'♥ 저장됨':'♡ 보관하기'}</button></div><p>재생은 데모 UI입니다. 실제 음원 파일/스트리밍 API 연결 전에는 오디오가 출력되지 않습니다.</p></div><div class="panel"><h3>권리 및 이용 정보</h3><span class="tag ${t.rights==='확인됨'?'':'warn'}">${t.rights}</span><p>권리 근거·제작자·원본 라이선스 확인 자료가 등록되어야 최종 이용 조건을 안내할 수 있습니다. 이 상태는 법률적 권리 보증이 아닙니다.</p><button class="link" onclick="go('license')">라이선스 안내 자세히 보기 →</button></div><div class="notice">라이선스 안내문은 자동 생성 초안이며 공개·상업 이용 전에 권리자 조건과 전문가 확인이 필요합니다.</div>`}
function library(){let list=tracks.filter(t=>favorites.has(t.id));return `${sectionHeading('YOUR COLLECTION','나의 보관함','마음에 드는 사운드를 모아두세요.')}<div class="pills"><button class="pill active">즐겨찾기 ${list.length}</button><button class="pill" onclick="alert('최근 재생 기록은 서버 연동 후 제공됩니다.')">최근 재생</button></div>${list.length?list.map(trackCard).join(''):'<div class="empty"><b>♡</b>아직 저장한 곡이 없어요.<br><button class="btn" style="margin-top:16px" onclick="go(\'explore\')">음악 둘러보기</button></div>'}`}
function plans(){return `${sectionHeading('MEMBERSHIP','나에게 맞는<br>사운드 플랜','구독 조건은 출시 정책 확정 후 안내됩니다.')}<div class="panel"><div class="eyebrow">STARTER</div><h2>Free Listener</h2><p>무료 미리듣기와 개인 보관함</p><ul><li>카탈로그 탐색</li><li>30초 미리듣기(제공 곡)</li><li>즐겨찾기 저장</li></ul><button class="btn ghost" onclick="alert('현재 데모 플랜입니다.')">현재 플랜</button></div><div class="panel"><div class="eyebrow">CREATOR</div><h2>Creator Plus</h2><h2 style="font-size:26px">가격 미정</h2><p>상업 프로젝트 사용 범위·다운로드 권한은 계약 확정 후 제공됩니다.</p><button class="btn" onclick="alert('구독 결제는 아직 연결되지 않았습니다.')">출시 알림 받기</button></div><div class="notice">실제 결제·자동 갱신·환불·해지 기능은 아직 구현되지 않았습니다. 구독 가능 상태로 오인하지 않도록 안내합니다.</div>`}
function profile(){return `${sectionHeading('ACCOUNT','내 정보','계정과 서비스 설정을 관리합니다.')}<div class="panel"><div class="row"><div class="avatar">J</div><div><b>게스트 사용자</b><p>데모 모드 · 로그인 미연결</p></div></div></div>${[['카탈로그 검수 도구','admin'],['라이선스 및 이용 안내','license'],['알림 설정','alerts'],['도움말 및 문의','help']].map(x=>`<div class="track" onclick="go('${x[1]}')"><div class="track-info"><strong>${x[0]}</strong><small>자세히 보기</small></div><b>›</b></div>`).join('')}<div class="notice">운영자 검수 메뉴는 화면 시안입니다. 실제 CSV/음원 업로드와 검증 실행은 Python CLI 또는 서버 작업 API 연결이 필요합니다.</div>`}
function license(){return `${sectionHeading('LICENSE GUIDE','이용 조건 안내','곡별 원본 권리 및 플랜 계약에 따라 달라집니다.')}<div class="panel"><h3>이용 전 확인할 항목</h3><ul><li>곡별 권리 근거와 원본 라이선스</li><li>상업적 이용 허용 여부와 매체 범위</li><li>출처 표기 및 편집 허용 조건</li><li>음원 파일 자체의 재판매·재배포 제한</li><li>Content ID 등 권리 관리 등록 제한</li></ul></div><div class="notice">이 화면은 공통 안내 예시이며 개별 곡의 법적 이용 허가를 의미하지 않습니다. 실제 라이선스는 권리자 원문과 계약을 기준으로 확인하세요.</div>`}
function admin(){return `${sectionHeading('ADMIN TOOL','카탈로그 검수','기존 BGM 카탈로그 CLI의 입력·검증 흐름을 모바일 화면으로 구성했습니다.')}<form id="checkForm" class="panel"><div class="field"><label>카탈로그 이름</label><input required placeholder="예: Spring Creator BGM"></div><div class="field"><label>곡 정보 CSV</label><input type="file" accept=".csv" required><small>필수 열: id,title,file,mood,genre,bpm,made_by,tool,rights_basis,terms_checked</small></div><div class="field"><label>음원 폴더 또는 파일 묶음</label><input type="file" multiple accept="audio/*" required></div><div class="field"><label>미리듣기 길이</label><select><option>30초 (기본)</option><option>15초</option><option>60초</option></select></div><button class="btn" style="width:100%">검증 요청 시뮬레이션</button></form><div id="adminResult"></div><div class="notice">현재 폼은 입력값 검증만 수행하는 컨셉입니다. 파일 업로드·ffmpeg 처리·index.html 및 LICENSE_GUIDE 생성은 백엔드/CLI 실행 연결 후 가능합니다.</div>`}
function render(){try{document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let pages={home,explore,library,plans,profile,detail,license,admin};app.innerHTML=(pages[tab]||home)();let f=document.getElementById('checkForm');if(f)f.onsubmit=e=>{e.preventDefault();document.getElementById('adminResult').innerHTML='<div class="panel"><b>입력 확인 완료</b><p>파일 선택값은 확인했습니다. 서버 검증 작업은 아직 연결되지 않았습니다.</p></div>'}}catch(err){app.innerHTML='<section class="panel"><h2>화면을 표시하지 못했습니다.</h2><p>브라우저 오류: '+String(err&&err.message||err).replace(/[<>&]/g,'')+'</p><button class="btn" onclick="location.reload()">다시 시도</button></section>';console.error('SoundShelf render error:',err)}}
function go(t){tab=t;render();window.scrollTo(0,0)}
function toggleFav(id){favorites.has(id)?favorites.delete(id):favorites.add(id);writeFavorites();render()}
function togglePlay(id){playing=playing===id?null:id;render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{query='';go(b.dataset.tab)}));
render();
</script></body></html>
